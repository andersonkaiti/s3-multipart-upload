service: s3-multipart-uploads

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  httpApi:
    cors: true
  environment:
    BUCKET_NAME: !Ref Bucket
  iam:
    role:
      statements:
        - Effect: 'Allow'
          Action:
            - 's3:putObject'
          Resource: !Sub '${Bucket.Arn}/*'

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false

functions:
  initiateMPU:
    handler: src/functions/initiate-mpu.handler
    events:
      - httpApi:
          path: /initiate-mpu
          method: POST
  completeMPU:
    handler: src/functions/complete-mpu.handler
    events:
      - httpApi:
          path: /complete-mpu
          method: POST

resources:
  Resources:
    Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: anderson-s3-multipart-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - "*"
              AllowedHeaders:
                - "*"
              AllowedMethods:
                - PUT
              ExposedHeaders:
                - ETag
