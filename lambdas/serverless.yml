service: s3-multipart-uploads

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    BUCKET_NAME: !Ref Bucket
  iam:
    role:
      statements:
        - Effect: 'Allow'
          Action:
            - 's3:putObject'
          Resource: !Sub '${Bucket.Arn}/*'

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false

functions:
  initiateMPU:
    handler: src/functions/initiate-mpu.handler
    events:
      - httpApi:
          path: /
          method: POST

resources:
  Resources:
    Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: anderson-s3-multipart-uploads
